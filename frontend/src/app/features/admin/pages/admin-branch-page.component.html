<section class="space-y-6">
  <header>
    <h1 class="text-2xl font-semibold">Sucursales</h1>
    <p class="text-sm text-slate-500">Administra las sucursales de la cadena.</p>
  </header>

  @if (errorMessage()) {
    <p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
  }

  @if (successMessage()) {
    <p class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-700">{{ successMessage() }}</p>
  }

  <form class="grid gap-3 rounded-xl border border-slate-200 bg-white p-4 sm:grid-cols-3" [formGroup]="form" (ngSubmit)="submit()">
    <input class="rounded-lg border border-slate-300 px-3 py-2" placeholder="Nombre" formControlName="name" />
    <input class="rounded-lg border border-slate-300 px-3 py-2" placeholder="Ciudad" formControlName="city" />
    <button class="rounded-lg bg-slate-900 px-4 py-2 text-sm text-white" type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Guardando...' : 'Crear sucursal' }}
    </button>
  </form>

  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
        <tr>
          <th class="px-4 py-3">Nombre</th>
          <th class="px-4 py-3">Ciudad</th>
          <th class="px-4 py-3">Default</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        @for (branch of branches(); track branch.id) {
          <tr>
            <td class="px-4 py-3">{{ branch.name }}</td>
            <td class="px-4 py-3">{{ branch.city }}</td>
            <td class="px-4 py-3">{{ branch.is_default ? 'Sí' : 'No' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
