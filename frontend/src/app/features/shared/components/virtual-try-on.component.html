<button hlmBtn type="button" class="cursor-pointer" (click)="openModal()" [disabled]="open()">
  Vestidor virtual
</button>

@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" role="presentation" (click)="$event.target === $event.currentTarget && closeModal()">
    <section class="relative h-[min(80vh,720px)] w-[min(92vw,960px)] overflow-hidden rounded-2xl bg-black shadow-2xl" role="dialog" aria-modal="true" aria-label="Resultado del probador virtual">
      <button hlmBtn type="button" variant="ghost" class="absolute right-3 top-3 z-10 cursor-pointer bg-black/70 text-white" (click)="closeModal()" aria-label="Cerrar vestidor virtual">Cerrar</button>
      <iframe
        #tryOnFrame
        src="/decart-try-on.html"
        title="Vestidor virtual Decart"
        class="h-full w-full border-0"
        allow="camera; microphone"
        (load)="sendConfiguration()"
      ></iframe>
    </section>
  </div>
}
