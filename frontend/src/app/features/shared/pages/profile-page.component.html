<section class="space-y-6 rounded-2xl bg-background p-6 text-foreground shadow-sm ring-1 ring-border/60">
  <div>
    <h1 class="text-2xl font-semibold text-primary">Mi perfil</h1>
  </div>

  @if (user(); as currentUser) {
    <div class="grid gap-4 rounded-xl border border-border bg-background p-4 sm:grid-cols-2">
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground">Nombre</p>
        <p class="mt-1 font-medium text-foreground">{{ currentUser.name }}</p>
      </div>
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground">Correo</p>
        <p class="mt-1 font-medium text-foreground">{{ currentUser.email }}</p>
      </div>
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground">Género</p>
        <p class="mt-1 font-medium text-foreground">{{ currentUser.gender === 'masculino' ? 'Masculino' : 'Femenino' }}</p>
      </div>
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground">Rol</p>
        <p class="mt-1 font-medium text-foreground">{{ userRoleLabel() }}</p>
      </div>
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground">Sucursal</p>
        <p class="mt-1 font-medium text-foreground">
          {{ currentUser.branch_id ?? 'Sin sucursal' }}
