<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
  <section hlmCard class="w-full max-w-md bg-white p-6 shadow-sm sm:p-8">
    <div hlmCardHeader class="space-y-2 p-0">
      <h1 hlmCardTitle class="text-2xl">Registro</h1>
      <p hlmCardDescription>Crea tu cuenta de cliente.</p>
    </div>

    <div hlmCardContent class="space-y-5 p-0">
      <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <div class="space-y-2">
          <label for="name" class="text-sm font-medium text-slate-900">Nombre</label>
          <input id="name" hlmInput formControlName="name" autocomplete="name" />
        </div>

        <div class="space-y-2">
          <label for="email" class="text-sm font-medium text-slate-900">Correo</label>
          <input id="email" hlmInput type="email" formControlName="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" (input)="normalizeEmailInput($event)" />
        </div>

        <div class="space-y-2">
          <label for="password" class="text-sm font-medium text-slate-900">Contraseña</label>
          <input id="password" hlmInput type="password" formControlName="password" autocomplete="new-password" />
        </div>

        <div class="space-y-2">
          <label for="gender" class="text-sm font-medium text-slate-900">Género</label>
          <div hlmSelect formControlName="gender">
            <hlm-select-trigger buttonId="gender">
              <span hlmSelectValue placeholder="Género"></span>
            </hlm-select-trigger>
            <hlm-select-content>
              <hlm-select-item value="masculino">Masculino</hlm-select-item>
              <hlm-select-item value="femenino">Femenino</hlm-select-item>
            </hlm-select-content>
          </div>
        </div>

        <button hlmBtn class="w-full" type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="text-sm text-slate-600 text-center">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login" class="font-medium text-slate-900 underline">Inicia sesión</a>
      </p>
    </div>
  </section>
</div>
